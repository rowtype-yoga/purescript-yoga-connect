package:
  name: yoga-connect-go
  description: gRPC servers and clients on Go through Iris, derived from
    yoga-connect's service rows, with OmIO handlers and Strom streams
  dependencies:
    - arrays: ">=7.3.1 <8.0.0"
    - datetime: ">=6.1.1 <7.0.0"
    - effect: ">=4.0.1 <5.0.0"
    - either: ">=6.1.1 <7.0.0"
    - exceptions: ">=6.1.1 <7.0.0"
    - go-io: "*"
    - maybe: ">=6.0.1 <7.0.0"
    - prelude: ">=6.0.3 <7.0.0"
    - record: ">=4.0.1 <5.0.0"
    - transformers: ">=6.1.1 <7.0.0"
    - tuples: ">=7.0.1 <8.0.0"
    - type-equality: ">=4.0.2 <5.0.0"
    - variant: ">=8.0.0 <9.0.0"
    - yoga-connect: "*"
    - yoga-go-http-om: "*"
    - yoga-protobuf: "*"
    - yoga-strom-io: "*"
  publish:
    version: 0.1.1
    license: MIT
    location:
      githubOwner: rowtype-yoga
      githubRepo: purescript-yoga-connect
      subdir: packages/yoga-connect-go
