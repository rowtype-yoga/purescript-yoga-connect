package:
  name: yoga-strom-io
  description: Pull-based, chunked streams in OmIO on Go, after ZIO's ZStream,
    with scopes, typed failures, interruption through Go's context.Context and
    streams on goroutines of their own
  dependencies:
    - arrays: ">=7.3.1 <8.0.0"
    - datetime: ">=6.1.1 <7.0.0"
    - effect: ">=4.0.1 <5.0.0"
    - either: ">=6.1.1 <7.0.0"
    - exceptions: ">=6.1.1 <7.0.0"
    - foldable-traversable: ">=6.0.1 <7.0.0"
    - go-io: "*"
    - integers: ">=6.0.2 <7.0.0"
    - maybe: ">=6.0.1 <7.0.0"
    - numbers: ">=9.0.2 <10.0.0"
    - prelude: ">=6.0.3 <7.0.0"
    - tailrec: ">=6.1.0 <7.0.0"
    - transformers: ">=6.1.1 <7.0.0"
    - tuples: ">=7.0.1 <8.0.0"
    - variant: ">=8.0.0 <9.0.0"
    - yoga-go-http-om: "*"
  publish:
    version: 0.3.2
    license: MIT
    location:
      githubOwner: rowtype-yoga
      githubRepo: purescript-yoga-connect
      subdir: packages/yoga-strom-io
