package:
  name: yoga-connect
  description: Services and messages as types for gRPC and Connect, their protocol
    buffer codecs and .proto, shared by the Go server and clients
  dependencies:
    - arrays: ">=7.3.1 <8.0.0"
    - effect: ">=4.0.1 <5.0.0"
    - either: ">=6.1.1 <7.0.0"
    - functions: ">=6.0.1 <7.0.0"
    - int64: ">=3.0.2 <4.0.0"
    - maybe: ">=6.0.1 <7.0.0"
    - partial: ">=4.0.1 <5.0.0"
    - prelude: ">=6.0.3 <7.0.0"
    - record: ">=4.0.1 <5.0.0"
    - strings: ">=6.1.0 <7.0.0"
    - tuples: ">=7.0.1 <8.0.0"
    - variant: ">=8.0.0 <9.0.0"
    - yoga-protobuf: "*"
  publish:
    version: 0.3.1
    license: MIT
    location:
      githubOwner: rowtype-yoga
      githubRepo: purescript-yoga-connect
      subdir: packages/yoga-connect
