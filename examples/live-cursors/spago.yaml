package:
  name: live-cursors
  description: A shared terminal canvas over gRPC, compiled to Go with googoo. Everyone's mouse and
    everyone's drawing, streamed both ways, with Bubble Tea.
  dependencies:
    - arrays
    - bubbletea
    - datetime
    - effect
    - either
    - foldable-traversable
    - go-io
    - go-os
    - integers
    - lipgloss
    - maybe
    - newtype
    - ordered-collections
    - prelude
    - strings
    - tuples
    - variant
    - yoga-connect-go
    - yoga-strom-io
workspace:
  packageSet:
    url: https://raw.githubusercontent.com/rowtype-yoga/purescript-go-package-sets/go-0.1.18-20261126.4/packages.json
  extraPackages:
    yoga-connect:
      git: https://github.com/rowtype-yoga/purescript-yoga-connect.git
      ref: v0.3.0
      subdir: packages/yoga-connect
    yoga-connect-go:
      git: https://github.com/rowtype-yoga/purescript-yoga-connect.git
      ref: v0.3.0
      subdir: packages/yoga-connect-go
    yoga-strom-io:
      git: https://github.com/rowtype-yoga/purescript-yoga-connect.git
      ref: v0.3.0
      subdir: packages/yoga-strom-io
